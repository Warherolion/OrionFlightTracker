; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F412RE]
platform = ststm32
board = genericSTM32F412RE
framework = arduino

; SWD programming/debugging via ST-Link (uses bundled OpenOCD, no extra tools needed)
upload_protocol = stlink
debug_tool = stlink

; Debug output goes over native USB CDC (Serial); printf is retargeted in main.cpp
monitor_speed = 115200

build_flags =
    -D USBCON
    -D USBD_USE_CDC
    ; Link newlib's float-capable printf so %f works (GPS report prints doubles)
    -Wl,-u,_printf_float

lib_deps =
    jgromes/RadioLib
    mikalhart/TinyGPSPlus
    stm32duino/STM32duino LSM6DSO32
    stm32duino/stm32duino LPS22HB
    sparkfun/SparkFun u-blox GNSS v3
    stm32duino/STM32duino STM32SD
    ; Registry FatFs is stuck at 2.0.3 (no f_unmount); STM32SD 1.4.0 needs newer.
    https://github.com/stm32duino/FatFs.git